services:
  crm:
    build: .
    restart: unless-stopped
    # Local binding; terminate HTTPS at a trusted reverse proxy in production.
    ports: ["127.0.0.1:3000:3000"]
    environment:
      DB_PATH: /app/data/crm.db
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required (openssl rand -base64 32)}
      CRM_PUBLIC_URL: ${CRM_PUBLIC_URL:?CRM_PUBLIC_URL is required (absolute CRM origin)}
      STOREFRONT_API_KEY: ${STOREFRONT_API_KEY:-}
      CATALOG_AGENT_KEY: ${CATALOG_AGENT_KEY:-}
      OZON_CLIENT_ID: ${OZON_CLIENT_ID:-}
      OZON_API_KEY: ${OZON_API_KEY:-}
      OZON_BASE_URL: ${OZON_BASE_URL:-https://api.ozonexpress.ma}
      OZON_USE_CUSTOM_TRACKING: ${OZON_USE_CUSTOM_TRACKING:-0}
      OZON_SUBMIT_INTERVAL_SEC: ${OZON_SUBMIT_INTERVAL_SEC:-15}
      OZON_POLL_INTERVAL_MIN: ${OZON_POLL_INTERVAL_MIN:-30}
      OZON_TRACK_BATCH: ${OZON_TRACK_BATCH:-25}
      SENDIT_PUBLIC_KEY: ${SENDIT_PUBLIC_KEY:-}
      SENDIT_SECRET_KEY: ${SENDIT_SECRET_KEY:-}
      COURIER_SUBMIT_INTERVAL_SEC: ${COURIER_SUBMIT_INTERVAL_SEC:-}
      COURIER_POLL_INTERVAL_MIN: ${COURIER_POLL_INTERVAL_MIN:-}
      COURIER_TRACK_BATCH: ${COURIER_TRACK_BATCH:-}
      MOCK_COURIER_PROFILE: ${MOCK_COURIER_PROFILE:-ozon}
      # Required: exactly "mock", "ozon" or "sendit". Only exact "mock" selects mock.
      DELIVERY_PROVIDER: ${DELIVERY_PROVIDER:?set mock, ozon or sendit}
      SECURITY_ALLOWED_ORIGINS: ${SECURITY_ALLOWED_ORIGINS:?SECURITY_ALLOWED_ORIGINS is required (exact CRM origin)}
      SECURITY_TRUSTED_IP_HEADER: ${SECURITY_TRUSTED_IP_HEADER:-}
      SECURITY_ACCEPT_GLOBAL_BUDGETS: ${SECURITY_ACCEPT_GLOBAL_BUDGETS:-}
      TIKTOK_PIXEL_ID: ${TIKTOK_PIXEL_ID:-}
      TIKTOK_ACCESS_TOKEN: ${TIKTOK_ACCESS_TOKEN:-}
      TIKTOK_TEST_EVENT_CODE: ${TIKTOK_TEST_EVENT_CODE:-}
      TIKTOK_API_BASE: ${TIKTOK_API_BASE:-https://business-api.tiktok.com/open_api/v1.3}
      FACEBOOK_PIXEL_ID: ${FACEBOOK_PIXEL_ID:-}
      FACEBOOK_ACCESS_TOKEN: ${FACEBOOK_ACCESS_TOKEN:-}
      FACEBOOK_TEST_EVENT_CODE: ${FACEBOOK_TEST_EVENT_CODE:-}
      FACEBOOK_API_VERSION: ${FACEBOOK_API_VERSION:-v22.0}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-qwen/qwen3.7-flash}
      UPLOAD_DIR: /app/data/uploads
      HEALTH_DETAILS_TOKEN: ${HEALTH_DETAILS_TOKEN:-}
      LOG_FORMAT: ${LOG_FORMAT:-}
      LOG_LEVEL: ${LOG_LEVEL:-}
      # Recovery only (see docs/operations.md); leave empty.
      MIGRATIONS_ALLOW_CHECKSUM_MISMATCH: ${MIGRATIONS_ALLOW_CHECKSUM_MISMATCH:-}
      # Used by `docker compose exec crm node scripts/backup-db.mjs`.
      BACKUP_DIR: ${BACKUP_DIR:-}
      BACKUP_RETENTION: ${BACKUP_RETENTION:-14}
      BACKUP_RCLONE_REMOTE: ${BACKUP_RCLONE_REMOTE:-}
    volumes:
      - crm-data:/app/data
volumes:
  crm-data:
